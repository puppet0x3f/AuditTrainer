[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "audittrainer"
version = "0.1.0"
description = "Learning responsibility decomposition, contract fulfillment, and bounded repair."
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "pydantic>=2,<3",
    "PyYAML>=6,<7",
]

[project.optional-dependencies]
train = [
    "torch==2.10.0",
    "transformers==4.57.6",
    "peft>=0.18,<0.19",
    "accelerate>=1.10,<2",
    "bitsandbytes==0.48.2",
]
dev = ["pytest>=8,<10"]
data = ["pyarrow>=18,<24", "huggingface-hub>=0.36,<1", "tqdm>=4,<5"]

[tool.setuptools.packages.find]
where = ["src"]
