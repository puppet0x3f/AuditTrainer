# "extends", "final_only", and "no_effect_gate" are project-level semantics.
# train_sft resolves these instead of forwarding them directly to TrainingArguments.
extends: sft_main.yaml
# Historical F6/F7 fixtures retain their original runtime protocol.
framework_config: configs/framework.yaml
data:
  path: data/sft/smoke.jsonl
  allowed_splits: [SYN_FIXTURE]
training:
  max_length: 4096
  per_device_train_batch_size: 1
  gradient_accumulation_steps: 4
  max_steps: 10
  learning_rate: 0.0001
  logging_steps: 1
  save_strategy: final_only
  evaluation_strategy: no_effect_gate
  output_dir: runs/sft_smoke
